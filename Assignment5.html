<!DOCTYPE html>
<html lang="en">
<head>
    <title>Assignment 5 | Web Development</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

        }
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .con {
            height: 520px;
            width: 80%;

            display: flex;
            align-items: center;
        }

        .box {
            height: 100%;
            width: 320px;
        }
        
        .b1 {
            width: 2%;
            background-color: navy;
            border-radius: 10px;
        }
        
        .b2 {
            width: 65%;
            display: flex;
            align-items: center;
        }
        .b2 h1 {
            font-size: 118px;
            padding-left: 15px;
            font-weight: bold;
            color: navy;
        }
        
        .b3 {
            width: 38%;
            box-shadow: 0px 0px 10px 5px rgba(0, 0, 0, 0.3);
                        /* 2px -2px 5px 1px rgba(0, 0, 0, 0.3); */
            border-radius: 20px;
            overflow: hidden;

            display: flex;
            flex-direction: column;
        }

        .b3 .top {
            background-color: navy;
            width: 100%;
            height: 30%;

            position: relative;
        }

        .top .circle {
            width: 120px;
            height: 120px;
            background-color: white;
            border: 2px solid black;
            border-radius: 50%;

            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);

            display: flex;
            align-items: center;
            justify-content: center;
        }
        .circle img {
            border-radius: 50%;
            width: 110px;
            height: 110px;
            object-fit: cover;

        }


        .b3 .bottom {
            width: 100%;
            height: 70%;
            text-align: center;
            padding: 20px 0px;
        }
        .b3 h1 {
            margin-top: 20px;
        }
        .b3 .logos {
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            font-size: 30px;
        }

        .bottom .buttons {
            display: flex;
            margin: 10px 0;
            padding: 10px;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        button {
            width: 160px;
            padding: 10px 12px;
            font-size: 18px;
            border-radius: 30px;
            border: none;
            background-color: navy;
            color: white;
            font-weight: 600;
        }
        button:hover {
            background-color: rgb(0, 0, 202);
        }

        .stats {
            padding: 10px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 50px;
        }
        .stats .sub-stat {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .stats .sub-stat:hover {
            color: red;
        }

        .sub-stat i {
            font-size: 24px;
        }
        .sub-stat p {
            font-size: 18px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="con">
        <div class="box b1"></div>
        <div class="box b2">
            <h1>Profile Card UI/UX Design</h1>  
        </div>

        <div class="box b3">
            <div class="top">
                <div class="circle">
                    <img src="image1.jpg" alt="">
                </div>
            </div>

            <div class="bottom">
                <h1>Software Developer</h2>
                <h2>Dezyne École College</h3>
                <div class="logos">
                    <i class="fa fa-brands fa-instagram" style="color: red;"></i>
                    <i class="fa fa-brands fa-linkedin" style="color: blue;"></i>
                    <i class="fa fa-brands fa-twitter" style="color: cyan;"></i>
                    <i class="fa fa-brands fa-facebook" style="color: blue;"></i>
                    <i class="fa fa-brands fa-github" style="color: black;"></i>
                </div>

                <div class="buttons">
                    <button>Subscribe</button>
                    <button>Message</button>
                </div>

                <div class="stats">
                    <div class="sub-stat">
                        <i class="fa fa-solid fa-heart"></i>
                        <p>22k</p>
                    </div>

                    <div class="sub-stat">
                        <i class="fa fa-solid fa-comment"></i>
                        <p>1.34k</p>
                    </div>

                    <div class="sub-stat">
                        <i class="fa fa-solid fa-share"></i>
                        <p>8k</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
